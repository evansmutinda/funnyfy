<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plan Badge + Progress Bar – 3 Options</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f8fafc;
      padding: 24px;
      max-width: 400px;
      margin: 0 auto;
    }
    h1 { font-size: 18px; color: #0f172a; margin-bottom: 8px; }
    .label { font-size: 12px; color: #64748b; margin-bottom: 8px; margin-top: 20px; }
    .demo { margin-bottom: 32px; }

    /* Option 1: Fill inside badge */
    .badge-fill-inside {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 36px;
      padding: 0 16px;
      background: #ffffff;
      border: 2px solid #e2e8f0;
      border-radius: 999px;
      position: relative;
      overflow: hidden;
    }
    .badge-fill-inside .fill {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 89%;
      background: #f59e0b;
      opacity: 0.25;
      border-radius: 999px 0 0 999px;
    }
    .badge-fill-inside .text {
      position: relative;
      z-index: 1;
      font-size: 13px;
      font-weight: 600;
      color: #374151;
    }

    /* Option 2: Badge as bar */
    .badge-as-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 36px;
      padding: 0 16px;
      background: #e5e7eb;
      border-radius: 999px;
      position: relative;
      overflow: hidden;
    }
    .badge-as-bar .fill {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 89%;
      background: #f59e0b;
      border-radius: 999px 0 0 999px;
    }
    .badge-as-bar .text {
      position: relative;
      z-index: 1;
      font-size: 13px;
      font-weight: 600;
      color: #1f2937;
      text-shadow: 0 0 2px rgba(255,255,255,0.8);
    }

    /* Option 3: Segmented pill */
    .badge-segmented {
      display: flex;
      height: 36px;
      border-radius: 999px;
      overflow: hidden;
      border: 2px solid #e2e8f0;
    }
    .badge-segmented .segment-fill {
      width: 89%;
      background: #f59e0b;
      display: flex;
      align-items: center;
      padding-left: 12px;
    }
    .badge-segmented .segment-text {
      flex: 1;
      min-width: 0;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 14px;
      font-size: 13px;
      font-weight: 600;
      color: #374151;
    }
  </style>
</head>
<body>
  <h1>Plan badge + progress bar ideas</h1>
  <p style="font-size: 14px; color: #64748b;">Usage: Popular • 89/100 (89% filled)</p>

  <div class="label">Option 1: Fill inside badge</div>
  <div class="demo">
    <div class="badge-fill-inside">
      <div class="fill"></div>
      <span class="text">Popular • 89/100</span>
    </div>
  </div>

  <div class="label">Option 2: Badge as bar</div>
  <div class="demo">
    <div class="badge-as-bar">
      <div class="fill"></div>
      <span class="text">Popular • 89/100</span>
    </div>
  </div>

  <div class="label">Option 3: Segmented pill</div>
  <div class="demo">
    <div class="badge-segmented">
      <div class="segment-fill"></div>
      <div class="segment-text">Popular • 89/100</div>
    </div>
  </div>

  <p style="font-size: 12px; color: #94a3b8; margin-top: 32px;">
    Open this file in a browser to preview. Path: apps/mobile/badge-progress-mockups.html
  </p>
</body>
</html>
